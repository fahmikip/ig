<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Coverly</title>
  <style>
    :root { --text:#151515; --text-2:#6b6b66; --bg:#f6f6f3; --accent:#ff4a2e; }
    html[data-theme="dark"] { --text:#f4f4f1; --text-2:#a6a6a0; --bg:#0e0e0e; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--text);
      font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif; text-align: center;
    }
    .wrap { padding: 40px 20px; }
    h1 { font-size: 72px; margin: 0 0 8px; letter-spacing: -0.03em; }
    .mark { color: var(--accent); }
    p { color: var(--text-2); margin: 0 0 28px; font-size: 16px; }
    a {
      display: inline-block; padding: 13px 26px; border-radius: 14px;
      background: var(--text); color: var(--bg); text-decoration: none;
      font-weight: 600; font-size: 15px;
    }
    html[data-theme="dark"] a { background: #f4f4f1; color: #141414; }
  </style>
  <script>
    /* Show dark mode if user prefers it */
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
</head>
<body>
  <main class="wrap">
    <h1>4<span class="mark">0</span>4</h1>
    <p>This page drifted out of frame.</p>
    <a href="./">Back to Coverly</a>
  </main>
</body>
</html>
